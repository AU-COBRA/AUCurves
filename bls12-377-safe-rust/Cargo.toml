[package]
name = "bls12-377-safe-rust"
version = "0.1.0"
edition = "2021"
description = "BLS12-377 field arithmetic — fiat-rust leaves + Bernstein-Yang CT inverse"
license = "Apache-2.0"
publish = false

[lib]
name = "bls12_377"
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dependencies]
fiat-crypto = { path = "../fiat-crypto/fiat-rust" }
safegcd     = { path = "../safegcd-rs" }

[dev-dependencies]

[features]
default = []
# Use Jasmin-emitted .s files (verified rust_cmd_ed -> bedrock2 ->
# Jasmin pipeline) for the Fp leaves that jasminc accepts.
# Currently: add/sub/select_znz only — mul/square hit jasminc's
# register-allocation ceiling (same blocker BLS12-381 hits).
jasmin_leaves = []
