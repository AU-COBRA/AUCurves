[package]
name = "bls12-381-safe-rust"
version = "0.1.0"
edition = "2021"
description = "BLS12-381 pairing extracted from verified bedrock2, with safe Rust API"
license = "Apache-2.0"

[features]
cryptopt = []  # Enables CryptOpt-accelerated mul/square (set by build.rs when nasm available)
# Opt out of the Bernstein-Yang (safegcd) Fp inversion and fall back to the
# Fermat ladder x^(p-2).  Both are hand-written Rust in src/stubs.rs; the
# Fermat ladder is ~20x slower.  Kept as a cross-check oracle for the KAT in
# src/stubs.rs and for builds that do not want the `safegcd` dependency.
fermat_inv = []

[dependencies]
# Bernstein-Yang constant-time modular inversion.  Hand-written Rust (a port
# of libsecp256k1's secp256k1_modinv64); the divstep convergence bound it
# instantiates is proved in AUCurves/src/Arithmetic/safegcd/, but the Rust
# code itself is NOT extracted from Rocq.  Same provenance as the identical
# module vendored in bls12-jasmin-rs/src/safegcd_bls12_381.rs.
safegcd = { path = "../safegcd-rs" }

[dev-dependencies]
blst = "0.3"
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-std = "0.5"

[[example]]
name = "bench_compare"
path = "examples/bench_compare.rs"

[lib]
name = "bls12_381"
path = "src/lib.rs"

[[example]]
name = "pairing_test"
path = "examples/pairing_test.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "multilin_test"
path = "examples/multilin_test.rs"

[[example]]
name = "ml_dump"
path = "examples/ml_dump.rs"
