[package]
name = "p224-safe-rust"
version = "0.1.0"
edition = "2021"
description = "P224 field arithmetic — fiat-rust leaves + Bernstein-Yang CT inverse"
license = "Apache-2.0"

[lib]
name = "p224"
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dependencies]
fiat-crypto = { path = "../fiat-crypto/fiat-rust" }
safegcd     = { path = "../safegcd-rs" }

[dev-dependencies]
