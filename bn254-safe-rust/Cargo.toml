[package]
name = "bn254-safe-rust"
version = "0.1.0"
edition = "2021"
description = "BN254 pairing extracted from verified bedrock2, with safe Rust API"
license = "Apache-2.0"

[features]
# Opt out of the Bernstein-Yang (safegcd) Fp inversion and fall back to the
# Fermat ladder x^(p-2).  Both are hand-written Rust in src/stubs.rs; the
# Fermat ladder is several times slower.  Kept as the cross-check oracle for
# the KAT in src/stubs.rs and for builds that do not want the `safegcd`
# dependency.
fermat_inv = []

[dependencies]
# Bernstein-Yang constant-time modular inversion.  Hand-written Rust (a port
# of libsecp256k1's secp256k1_modinv64); the divstep convergence bound it
# instantiates is proved in AUCurves/src/Arithmetic/safegcd/, but the Rust
# code itself is NOT extracted from Rocq.  See HAND_WRITTEN_AUDIT.md.
safegcd = { path = "../safegcd-rs" }

[lib]
name = "bn254"
path = "src/lib.rs"

[[example]]
name = "pairing_test"
path = "examples/pairing_test.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "multilin_test"
path = "examples/multilin_test.rs"

[[example]]
name = "multilin_test_optimal"
path = "examples/multilin_test_optimal.rs"
[[example]]
name = "ml_compare"
path = "examples/ml_compare.rs"
[[example]]
name = "debug_test"
path = "examples/debug_test.rs"
[[example]]
name = "debug2"
path = "examples/debug2.rs"

[[example]]
name = "bench_vs_production"
path = "examples/bench_vs_production.rs"

[[example]]
name = "bench_breakdown"
path = "examples/bench_breakdown.rs"

[[example]]
name = "bench_inv_cost"
path = "examples/bench_inv_cost.rs"

[[example]]
name = "bench_projective"
path = "examples/bench_projective.rs"

[dev-dependencies]
ark-bn254 = "0.5"
ark-ec    = "0.5"
ark-ff    = "0.5"
ark-std   = "0.5"
