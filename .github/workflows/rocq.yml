name: rocq

# Builds the Rocq development.  This is deliberately NOT on every push:
# the dependency set (Rocq 9.2, coqutil, bedrock2, Rupicola, Rewriter,
# Coqprime, Bignums) plus the fiat-crypto submodule is expensive to
# build from cold, and fiat-crypto's push-button synthesis files run for
# tens of minutes each.  It runs weekly and on demand.
#
# The Rust workflow is the fast signal; this one is the thorough one.

on:
  schedule:
    # 03:00 UTC on Sundays.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'dune target to build'
        required: false
        default: 'src/Bedrock'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Restore and save are separate steps so that the switch is saved as
      # soon as it is built, even if a later step fails; actions/cache@v4
      # alone saves only when the whole job succeeds.
      - name: Restore the opam switch
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          # Bump the suffix to force a rebuild of the switch.
          key: opam-rocq92-${{ runner.os }}-v1

      - name: Set up Rocq 9.2 and the development's dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y opam m4 pkg-config libgmp-dev
          opam init --bare --disable-sandboxing --yes || true
          # Rocq 9.2.0 is the first release with native_compute on OCaml 5.
          # rocq-native comes first so that every library gets native code;
          # src/Bedrock and src/Theory build with (mode native).  INSTALL.md
          # lists the same versions.
          opam switch create rocq-9.2 ocaml-base-compiler.5.2.0 --yes || opam switch rocq-9.2
          eval $(opam env --switch=rocq-9.2)
          opam repo add rocq-released https://rocq-prover.org/opam/released --yes || true
          opam install --yes rocq-native.2
          opam install --yes dune.3.23.1 rocq-core.9.2.0 rocq-stdlib.9.2.0 rocq-bignums \
            rocq-coqprime.1.9.0 coq-coqutil.0.0.7 coq-bedrock2.0.0.9 coq-rupicola.0.0.11 \
            coq-ext-lib coq-paco coq-itree rocq-mathcomp-ssreflect.2.6.0 \
            rocq-mathcomp-algebra.2.6.0 coq-mathcomp-word.3.5
          if ! opam list --installed --short coq-rewriter | grep -q .; then
            git clone --branch v0.0.21 https://github.com/mit-plv/rewriter /tmp/rewriter
            git -C /tmp/rewriter apply "$GITHUB_WORKSPACE/patches/coq-rewriter-0.0.21-rocq92.patch"
            git -C /tmp/rewriter -c user.name=ci -c user.email=ci@localhost \
              commit -q -am "Rocq 9.2 patch"
            # Pin as a git source: a path pin copies the tree with rsync, which
            # drops the symlink PerfTesting/Makefile.coq.conf (its target is
            # generated by make), and make then stops at the missing include.
            opam pin add --yes coq-rewriter.0.0.21 "git+file:///tmp/rewriter#HEAD"
          fi

      - name: Jasmin's Rocq library (for src/Jasmin)
        run: |
          set -e
          eval $(opam env --switch=rocq-9.2)
          if [ ! -d "$(opam var lib)/coq/user-contrib/Jasmin" ]; then
            git clone https://github.com/jasmin-lang/jasmin /tmp/jasmin
            cd /tmp/jasmin
            git -c user.name=ci -c user.email=ci@localhost checkout -q 294b46e
            git -c user.name=ci -c user.email=ci@localhost am "$GITHUB_WORKSPACE"/patches/jasmin/*.patch
            cd proofs
            VF="$(grep '\.v$' _CoqProject | grep -vx lang/extraction.v | tr '\n' ' ')"
            rocq makefile -f _CoqProject -o Makefile.coq
            make -f Makefile.coq -j2 VFILES="$VF"
            make -f Makefile.coq install VFILES="$VF"
          fi

      # After the Jasmin step, which installs into the switch.
      - name: Save the opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: opam-rocq92-${{ runner.os }}-v1

      # ulimit and OCAMLRUNPARAM are required, not optional: without
      # them large Z.pow reductions overflow the kernel stack and the
      # native compiler retries silently.
      - name: Build
        run: |
          eval $(opam env --switch=rocq-9.2)
          ulimit -s unlimited
          export OCAMLRUNPARAM="b,l=1000000000"
          dune build -j 1 --display=short "${{ github.event.inputs.target || 'src/Bedrock' }}"

      # A theorem can be Qed and still rest on an axiom, and a Section
      # hypothesis is invisible to Print Assumptions once discharged as
      # an argument.  This checks the headline results explicitly.
      - name: Axiom check
        run: |
          eval $(opam env --switch=rocq-9.2)
          ulimit -s unlimited
          cat > /tmp/axioms.v <<'EOF'
          Require Import Bedrock.Group.ScalarMult.P256_wNAF_Instance.
          Require Import Bedrock.Group.ScalarMult.P256_wNAF_TableFunc.
          Require Import Bedrock.Group.ScalarMult.BN254_Ladderstep.
          Require Import Bedrock.Group.CurveAdd.PointDoubleA0.
          Print Assumptions p256_Hexcept.
          Print Assumptions p256_wnaf_single_full_precomputed.
          Print Assumptions bn254_G1_ladderstep_ok.
          Print Assumptions rcb_double_a0_correct.
          Print Assumptions rcb_double_a0_eq_ladderstep.
          EOF
          rocq compile -R _build/default/src/Bedrock Bedrock \
            -Q _build/default/fiat-crypto/src Crypto \
            -Q _build/default/src/Theory Theory \
            -Q _build/default/src/Implementations Implementations \
            /tmp/axioms.v 2>&1 | tee /tmp/axioms.out
          if grep -q 'Axioms:' /tmp/axioms.out; then
            echo "::error::a headline theorem depends on an axiom"; exit 1
          fi
